<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sideburn 2026 — Camp Placement</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&family=Great+Vibes&display=swap");
      :root {
        --bg: #ffffff;
        --text: #222;
        --muted: #555;
        --subtitle: #7c4dbd;
        --grid: #e0e0e0;
        --axis: #bbb;
        --axis-title: #555;
        --label-muted: #555;
        --title-grad: linear-gradient(100deg, #7c4dbd 0%, #4caf50 28%, #f5c000 55%, #ff6b1a 78%, #e0226e 100%);
        --title-shadow: none;
        --toggle-bg: #f0f0f0;
        --toggle-border: #ccc;
      }
      [data-theme="dark"] {
        --bg: #0f0f14;
        --text: #e8e8e8;
        --muted: #aaa;
        --subtitle: #b48dde;
        --grid: #26262f;
        --axis: #555;
        --axis-title: #aaa;
        --label-muted: #999;
        --title-grad: linear-gradient(100deg, #b48dde 0%, #6ed87a 28%, #ffd84d 55%, #ff9357 78%, #ff5a96 100%);
        --title-shadow: drop-shadow(0 0 12px rgba(180, 141, 222, 0.35));
        --toggle-bg: #1c1c24;
        --toggle-border: #333;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Share Tech Mono", monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        transition: background 0.3s ease, color 0.3s ease;
      }
      .theme-toggle {
        position: absolute;
        top: 50%;
        right: -54px;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--toggle-bg);
        border: 1px solid var(--toggle-border);
        cursor: pointer;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        color: var(--text);
        transition: background 0.3s ease, border-color 0.3s ease;
      }
      @media (max-width: 900px) {
        .theme-toggle { right: 4px; width: 32px; height: 32px; font-size: 0.9rem; }
      }
      .theme-toggle:hover { opacity: 0.85; }
      .title-sparks {
        position: relative;
        text-align: center;
        margin-bottom: 0px;
      }
      h1 {
        font-family: "Great Vibes", cursive;
        font-size: clamp(2.8rem, 8.5vw, 5.2rem);
        background: var(--title-grad);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: var(--title-shadow);
        position: relative;
        z-index: 1;
        margin: 0;
      }
      .spark {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        opacity: 0;
        animation: sparkFloat 2.5s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes sparkFloat {
        0%   { opacity: 0; transform: translateY(0) scale(1); }
        20%  { opacity: 0.9; }
        100% { opacity: 0; transform: translateY(var(--rise, -40px)) scale(0); }
      }
      .subtitle {
        font-size: 1.1rem;
        letter-spacing: 0.3em;
        color: var(--subtitle);
        text-transform: uppercase;
        margin-bottom: 24px;
        text-align: center;
      }
      .graph-wrapper {
        position: relative;
        width: min(85vw, 85vh, 420px);
        aspect-ratio: 1;
      }
      svg.graph {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .readout {
        margin-top: 20px;
        text-align: center;
        font-size: 0.825rem;
        line-height: 1.8;
        min-height: 60px;
      }
      .readout .label {
        font-family: "Black Ops One", cursive;
        font-size: 1.1rem;
        color: #ff6b1a;
        display: block;
        letter-spacing: 0.1em;
      }
      .readout .desc {
        color: #7c4dbd;
        font-size: 1rem;
        letter-spacing: 0.05em;
      }
      .readout .camper {
        display: block;
        color: var(--muted);
        font-size: 1rem;
        font-style: italic;
        margin-top: 4px;
      }
      .slider-container {
        margin-top: 20px;
        text-align: center;
      }
      .slider-labels {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 0.77rem;
        letter-spacing: 0.1em;
        color: var(--muted);
      }
      .slider {
        width: min(80vw, 400px);
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(
          to right,
          #7c4dbd,
          #4caf50,
          #f5c000,
          #ff6b1a
        );
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }
      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #e0226e;
        cursor: pointer;
        box-shadow: 0 0 8px rgba(224, 34, 110, 0.5);
      }
      .slider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #e0226e;
        cursor: pointer;
        border: none;
        box-shadow: 0 0 8px rgba(224, 34, 110, 0.5);
      }
      .side-logo {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        width: clamp(110px, 13vw, 190px);
        opacity: 0.85;
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .logo-left  { left:  clamp(140px, 20vw, 280px); }
      .logo-right { right: clamp(140px, 20vw, 280px); }
      .graph-logo { display: none; }
      @media (max-width: 900px) {
        body {
          min-height: 100dvh;
          justify-content: flex-start;
          padding: 12px 8px;
          gap: 2px;
        }
        h1 { font-size: clamp(3.4rem, 14vw, 5.5rem); }
        .subtitle { font-size: 0.95rem; letter-spacing: 0.22em; margin-bottom: 10px; }
        .graph-wrapper { width: min(96vw, 72vh); margin-top: 4px; }
        .readout { margin-top: 8px; }
        .slider-container { display: none; }
        .drag-hint { display: none; }
        .side-logo { display: none; }
        .theme-toggle { position: fixed; top: 52px; right: 12px; }
        .graph-logo {
          display: block;
          position: absolute;
          width: 22%;
          pointer-events: none;
          opacity: 0.82;
          z-index: 2;
        }
        .graph-logo-tl { left: 20%; top: 30%; }
        .graph-logo-br { left: 60%; top: 66%; }
      }
      [data-theme="dark"] svg.graph g[stroke="#e0e0e0"] { stroke: var(--grid); }
      [data-theme="dark"] svg.graph line[stroke="#bbb"],
      [data-theme="dark"] svg.graph polygon[fill="#bbb"] { stroke: var(--axis); fill: var(--axis); }
      [data-theme="dark"] svg.graph text[fill="#555"] { fill: var(--axis-title); }
      .drag-hint {
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        width: min(80vw, 400px);
        font-size: 0.77rem;
        letter-spacing: 0.1em;
        margin-top: 4px;
      }
      .drag-instruction {
        color: var(--muted);
        margin-bottom: 16px;
        text-align: center;
      }

    </style>
  </head>
  <body>
    <img class="side-logo logo-left"  src="3D SideBurn Logo.png" alt="Sideburn">
    <img class="side-logo logo-right" src="3D SideBurn Logo.png" alt="Sideburn">
    <div class="title-sparks" id="titleSparks">
      <h1>Sideburn 2026</h1>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">☾</button>
    </div>
    <div class="subtitle">Camp Placement Tool</div>
    <div class="drag-instruction"><em>↔ drag along the line to see relationships ↔</em></div>

    <div class="graph-wrapper">
      <img class="graph-logo graph-logo-tl" src="3D SideBurn Logo.png" alt="">
      <img class="graph-logo graph-logo-br" src="3D SideBurn Logo.png" alt="">
      <svg class="graph" id="graph" viewBox="0 0 400 400">
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur" />
            <feMerge>
              <feMergeNode in="coloredBlur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="glow-strong">
            <feGaussianBlur stdDeviation="5" result="coloredBlur" />
            <feMerge>
              <feMergeNode in="coloredBlur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <!-- Diagonal band gradient: purple (quiet/unseen) to orange (loud/visible) -->
          <linearGradient id="diagGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color: #7c4dbd; stop-opacity: 0.15" />
            <stop
              offset="50%"
              style="stop-color: #4caf50; stop-opacity: 0.12"
            />
            <stop
              offset="100%"
              style="stop-color: #ff6b1a; stop-opacity: 0.18"
            />
          </linearGradient>
          <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color: #7c4dbd" />
            <stop offset="40%" style="stop-color: #4caf50" />
            <stop offset="70%" style="stop-color: #f5c000" />
            <stop offset="100%" style="stop-color: #ff6b1a" />
          </linearGradient>
          <clipPath id="graphClip">
            <rect x="50" y="50" width="300" height="300" />
          </clipPath>
        </defs>

        <!-- Background grid -->
        <g stroke="#e0e0e0" stroke-width="1">
          <line x1="50" y1="50" x2="50" y2="350" />
          <line x1="50" y1="350" x2="350" y2="350" />
          <line x1="200" y1="50" x2="200" y2="350" stroke-dasharray="4,6" />
          <line x1="50" y1="200" x2="350" y2="200" stroke-dasharray="4,6" />
        </g>

        <!-- Diagonal band clipped to graph area -->
        <g clip-path="url(#graphClip)">
          <polygon points="50,350 350,50 350,110 50,410" fill="url(#diagGrad)" />
          <polygon points="50,290 290,50 350,50 50,350" fill="url(#diagGrad)" />
        </g>

        <!-- Diagonal line — rainbow gradient -->
        <line
          x1="50"
          y1="350"
          x2="350"
          y2="50"
          stroke="url(#lineGrad)"
          stroke-width="3"
          stroke-dasharray="8,5"
          filter="url(#glow)"
        />

        <!-- X axis -->
        <line
          x1="50"
          y1="350"
          x2="350"
          y2="350"
          stroke="#bbb"
          stroke-width="1.5"
        />
        <polygon points="350,350 342,345 342,355" fill="#bbb" />
        <!-- Y axis -->
        <line
          x1="50"
          y1="350"
          x2="50"
          y2="50"
          stroke="#bbb"
          stroke-width="1.5"
        />
        <polygon points="50,50 45,58 55,58" fill="#bbb" />

        <!-- X axis labels -->
        <text
          x="60"
          y="375"
          font-family="Share Tech Mono,monospace"
          font-size="12"
          fill="#7c4dbd"
          letter-spacing="1"
        >
          ◀ LESS VISIBLE
        </text>
        <text
          x="255"
          y="375"
          font-family="Share Tech Mono,monospace"
          font-size="12"
          fill="#ff6b1a"
          letter-spacing="1"
        >
          MORE VISIBLE ▶
        </text>
        <text
          x="200"
          y="400"
          font-family="Share Tech Mono,monospace"
          font-size="15"
          fill="#555"
          letter-spacing="3"
          text-anchor="middle"
        >
          VISIBILITY
        </text>

        <!-- Y axis title -->
        <text
          transform="rotate(-90) translate(-200, 22)"
          font-family="Share Tech Mono,monospace"
          font-size="15"
          fill="#555"
          letter-spacing="3"
          text-anchor="middle"
        >
          NOISE LEVEL
        </text>
        <!-- Y axis end labels -->
        <text
          transform="rotate(-90) translate(-80, 35)"
          font-family="Share Tech Mono,monospace"
          font-size="12"
          fill="#ff6b1a"
          letter-spacing="1"
          text-anchor="start"
        >
          LOUDER ▶
        </text>
        <text
          transform="rotate(-90) translate(-320, 35)"
          font-family="Share Tech Mono,monospace"
          font-size="12"
          fill="#7c4dbd"
          letter-spacing="1"
          text-anchor="end"
        >
          ◀ QUIETER
        </text>

        <!-- Draggable point -->
        <circle
          id="dot"
          cx="200"
          cy="200"
          r="14"
          fill="#e0226e"
          opacity="0.95"
          filter="url(#glow-strong)"
          style="cursor: grab"
        />
        <circle
          id="dotRing"
          cx="200"
          cy="200"
          r="20"
          fill="none"
          stroke="#e0226e"
          stroke-width="1.5"
          opacity="0.4"
        />
        <text
          id="dotLabel"
          x="200"
          y="204"
          font-family="Black Ops One,cursive"
          font-size="11"
          fill="white"
          text-anchor="middle"
          style="pointer-events: none"
        >
          US
        </text>
      </svg>
    </div>

    <div class="readout">
      <span class="label" id="zoneName">MIDFIELD</span>
      <span class="desc" id="zoneDesc">Drag the marker to explore the tradeoff</span>
      <span class="camper" id="zoneCamper"></span>
    </div>

    <div class="slider-container">
      <div class="slider-labels">
        <span>QUIET</span>
        <span>NOISY</span>
      </div>
      <input
        type="range"
        min="0"
        max="100"
        value="50"
        class="slider"
        id="tradeoffSlider"
      />
    </div>

    <div class="drag-hint"><span>REMOTE</span><span>CENTRAL</span></div>

    <script>
      (function() {
        const root = document.documentElement;
        const btn = document.getElementById("themeToggle");
        const saved = localStorage.getItem("theme");
        const initial = saved || "dark";
        root.setAttribute("data-theme", initial);
        btn.textContent = initial === "dark" ? "☀" : "☾";
        btn.addEventListener("click", function() {
          const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          btn.textContent = next === "dark" ? "☀" : "☾";
          localStorage.setItem("theme", next);
        });
      })();
    </script>

    <script>
      const svg = document.getElementById("graph");
      const dot = document.getElementById("dot");
      const dotRing = document.getElementById("dotRing");
      const dotLabel = document.getElementById("dotLabel");
      const zoneName = document.getElementById("zoneName");
      const zoneDesc = document.getElementById("zoneDesc");
      const zoneCamper = document.getElementById("zoneCamper");
      const slider = document.getElementById("tradeoffSlider");

      const x1 = 50,
        y1 = 350,
        x2 = 350,
        y2 = 50;
      let isDragging = false;

      function svgPoint(e) {
        const rect = svg.getBoundingClientRect();
        const scaleX = 400 / rect.width;
        const scaleY = 400 / rect.height;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
        };
      }

      function projectToDiagonal(px, py) {
        const dx = x2 - x1,
          dy = y2 - y1;
        const len2 = dx * dx + dy * dy;
        let t = ((px - x1) * dx + (py - y1) * dy) / len2;
        t = Math.max(0, Math.min(1, t));
        return { x: x1 + t * dx, y: y1 + t * dy, t };
      }

      function updateZone(t) {
        if (t < 0.2) {
          zoneName.textContent = "REMOTE";
          zoneDesc.textContent = "Remote · Quiet nights · Low discovery";
          zoneCamper.textContent = "“Where is everybody?”";
        } else if (t < 0.4) {
          zoneName.textContent = "SOFT EDGE";
          zoneDesc.textContent = "Some foot traffic · Decent rest · Findable if you look";
          zoneCamper.textContent = "“I can hear the bass… faintly”";
        } else if (t < 0.6) {
          zoneName.textContent = "MIDFIELD";
          zoneDesc.textContent = "Balanced tradeoff · Your call on which matters more";
          zoneCamper.textContent = "“We get to vibe AND to nap”";
        } else if (t < 0.8) {
          zoneName.textContent = "VISIBLE CAMP";
          zoneDesc.textContent = "Good exposure · Noisier nights · High traffic zone";
          zoneCamper.textContent = "“Welcome! No seriously, welcome to the endless party!”";
        } else {
          zoneName.textContent = "MAIN DRAG";
          zoneDesc.textContent = "Maximum visibility · Maximum noise · Earplugs useless";
          zoneCamper.textContent = "“Sleep is a social construct...”";
        }
      }

      function setDotPosition(t) {
        const x = x1 + t * (x2 - x1);
        const y = y1 + t * (y2 - y1);
        dot.setAttribute("cx", x);
        dot.setAttribute("cy", y);
        dotRing.setAttribute("cx", x);
        dotRing.setAttribute("cy", y);
        dotLabel.setAttribute("x", x);
        dotLabel.setAttribute("y", y + 4);
        updateZone(t);
        slider.value = Math.round(t * 100);
      }

      function moveDot(e) {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();
        const p = svgPoint(e);
        const proj = projectToDiagonal(p.x, p.y);
        setDotPosition(proj.t);
      }

      // Attach to the whole SVG so any tap/click on the graph starts dragging —
      // a fingertip cannot reliably hit the small dot directly on mobile.
      svg.addEventListener("mousedown", (e) => {
        isDragging = true;
        dot.style.cursor = "grabbing";
        e.preventDefault();
        moveDot(e);
      });
      svg.addEventListener(
        "touchstart",
        (e) => {
          isDragging = true;
          e.preventDefault();
          moveDot(e);
        },
        { passive: false },
      );
      window.addEventListener("mouseup", () => {
        isDragging = false;
        dot.style.cursor = "grab";
      });
      window.addEventListener("touchend", () => { isDragging = false; });
      window.addEventListener("touchcancel", () => { isDragging = false; });
      window.addEventListener("mousemove", moveDot);
      window.addEventListener("touchmove", moveDot, { passive: false });

      slider.addEventListener("input", () => setDotPosition(slider.value / 100));

      setDotPosition(0.5);

      // Hook for audio — defined by the audio script below
      window._onZone = null;
      window._startAudio = null;

      const origUpdateZone = updateZone;
      updateZone = function(t) {
        origUpdateZone(t);
        try { if (window._onZone) window._onZone(t); } catch(e) {}
      };

      function _kickAudio() {
        try { if (window._startAudio) window._startAudio(); } catch(e) {}
      }
      svg.addEventListener("mousedown", _kickAudio);
      svg.addEventListener("touchstart", _kickAudio, { passive: true });
      slider.addEventListener("mousedown", _kickAudio, { once: true });
      slider.addEventListener("touchstart", _kickAudio, { passive: true, once: true });
      slider.addEventListener("input", _kickAudio, { once: true });
    </script>

    <script>
      // Audio — runs after main script; errors here cannot break drag
      try {
        var SOUNDS = [
          "sounds/REMOTE__samwd__kingston-ny-late-summer-midnight-crickets-some-mic-and-freeway-noise-from-middle.wav",
          "sounds/SOFT_EDGE__0alexis0__music-festival-distant.mp3",
          "sounds/MIDFIELD__spyrospolitis__apollo89-idle-conversation-groups-people-small-town-square-athens-greece.wav",
          "sounds/VISIBLE_CAMP__kyles__ganpati-street-festival-large-exterior-crowd-with-distant-music-and-nearby-cymbals-and-man-shouting-on-megaphone-india.mp3",
          "sounds/MAIN_DRAG__xcreenplay__booji-rave.wav"
        ];
        var tracks = SOUNDS.map(function(src) {
          var a = new Audio(src);
          a.loop = true;
          a.volume = 0;
          a.preload = "none";
          return a;
        });
        var activeIdx = -1, audioOn = false, fadeTimer = null;

        function zoneIdx(t) {
          if (t < 0.2) return 0; if (t < 0.4) return 1;
          if (t < 0.6) return 2; if (t < 0.8) return 3; return 4;
        }

        function crossfade(from, to) {
          if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
          // Kill every track that isn't part of this transition
          for (var i = 0; i < tracks.length; i++) {
            if (i !== from && i !== to) {
              tracks[i].volume = 0;
              tracks[i].pause();
            }
          }
          var fromVol = (from >= 0) ? tracks[from].volume : 0;
          tracks[to].volume = 0;
          tracks[to].play().catch(function(){});
          var step = 0;
          fadeTimer = setInterval(function() {
            step++;
            var p = step / 40;
            if (from >= 0) tracks[from].volume = Math.max(0, fromVol * (1 - p));
            tracks[to].volume = Math.min(1, p);
            if (step >= 40) {
              clearInterval(fadeTimer); fadeTimer = null;
              if (from >= 0) { tracks[from].pause(); tracks[from].volume = 0; }
            }
          }, 20);
        }

        window._onZone = function(t) {
          var idx = zoneIdx(t);
          if (idx === activeIdx) return;
          var prev = activeIdx; activeIdx = idx;
          if (audioOn) crossfade(prev, idx);
        };

        window._startAudio = function() {
          if (audioOn) return;
          audioOn = true;
          var idx = activeIdx < 0 ? 2 : activeIdx;
          activeIdx = idx;
          crossfade(-1, idx);
        };

        // Preload: start midfield (current zone) immediately, then chain
        // the rest smallest-first so each zone is ready before the user reaches it.
        // [1=SOFT_EDGE 883KB, 4=MAIN_DRAG 2MB, 0=REMOTE 7MB, 3=VISIBLE_CAMP, 2=MIDFIELD 35MB]
        tracks[2].preload = "auto"; tracks[2].load(); // current zone — highest priority

        (function loadNext(queue) {
          if (!queue.length) return;
          var idx = queue.shift();
          var t = tracks[idx];
          t.preload = "auto";
          t.load();
          var done = false;
          function advance() { if (!done) { done = true; loadNext(queue); } }
          t.addEventListener("canplaythrough", advance, { once: true });
          setTimeout(advance, 10000); // fallback if canplaythrough never fires
        }([1, 4, 0, 3]));

      } catch(e) { console.warn("Audio init failed:", e); }
    </script>

    <script>
      // Logo animations — JS-driven so zone transitions are seamless
      var logos = document.querySelectorAll('.side-logo, .graph-logo');

      // Per zone: [amplitude px, frequency hz, rotation deg, bounce 0-1]
      var ZONES = [
        [  7, 0.25,  0,   0 ],   // REMOTE       — gentle hover
        [ 13, 0.40,  0,   0 ],   // SOFT EDGE    — medium hover
        [ 18, 0.56,  2,   0 ],   // MIDFIELD     — hover + tilt
        [ 24, 0.91,  2.5, 0 ],   // VISIBLE CAMP — fast + tilt
        [ 34, 1.54,  0,   1 ],   // MAIN DRAG    — bounce
      ];

      // Live values, start at midfield (zone 2)
      var amp = 18, freq = 0.56, rot = 2, bnc = 0;
      var tAmp = 18, tFreq = 0.56, tRot = 2, tBnc = 0;
      var phase = 0, last = null;

      function tick(now) {
        if (!last) last = now;
        var dt = Math.min((now - last) / 1000, 0.05);
        last = now;

        // Exponential smooth toward target — frame-rate independent, ~0.5s blend
        var k = 1 - Math.exp(-dt * 6);
        amp  += (tAmp  - amp)  * k;
        freq += (tFreq - freq) * k;
        rot  += (tRot  - rot)  * k;
        bnc  += (tBnc  - bnc)  * k;

        phase += freq * dt * Math.PI * 2;

        var s = Math.sin(phase);
        // Blend between sine (hover) and abs-sine (bounce-up-and-back)
        var y = amp * ((1 - bnc) * s - bnc * Math.abs(s));
        var r = rot * Math.sin(phase + 0.3);

        logos.forEach(function(el) {
          el.style.transform =
            'translateY(calc(-50% + ' + y.toFixed(1) + 'px)) rotate(' + r.toFixed(2) + 'deg)';
        });

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      function setLogoZone(idx) {
        tAmp = ZONES[idx][0]; tFreq = ZONES[idx][1];
        tRot = ZONES[idx][2]; tBnc  = ZONES[idx][3];
      }

      // Spark zone params: [minSize px, maxSize px, minDur s, maxDur s, rise px]
      var SPARK_ZONES = [
        [ 1.5,  3,  3.5, 5.5,  20 ],  // REMOTE       — tiny, slow, barely float
        [ 2,    4,  2.5, 4.5,  30 ],  // SOFT EDGE
        [ 2.5,  6,  2.0, 3.5,  42 ],  // MIDFIELD
        [ 3.5,  8,  1.3, 2.5,  60 ],  // VISIBLE CAMP
        [ 5,   13,  0.8, 1.6,  85 ],  // MAIN DRAG    — large, fast, rocket
      ];
      var sparkEls = [];
      const sparksContainer = document.getElementById("titleSparks");
      const sparkColors = ["#ff6b1a", "#e0226e", "#f5c000", "#7c4dbd", "#4caf50"];
      for (let i = 0; i < 14; i++) {
        const s = document.createElement("div");
        s.className = "spark";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = (40 + Math.random() * 30) + "%";
        s.style.background = sparkColors[Math.floor(Math.random() * sparkColors.length)];
        s.style.animationDelay = (Math.random() * 2.5) + "s";
        s._r = Math.random(); // per-spark variety factor, fixed at creation
        sparksContainer.appendChild(s);
        sparkEls.push(s);
      }

      function updateSparks(idx) {
        var z = SPARK_ZONES[idx];
        sparkEls.forEach(function(s) {
          var r = s._r;
          var size = (z[0] + r * (z[1] - z[0])).toFixed(1);
          var dur  = (z[2] + r * (z[3] - z[2])).toFixed(2);
          s.style.width  = size + 'px';
          s.style.height = size + 'px';
          s.style.animationDuration = dur + 's';
          s.style.setProperty('--rise', '-' + z[4] + 'px');
        });
      }
      updateSparks(2); // start at midfield

      var origOnZone = window._onZone;
      window._onZone = function(t) {
        if (origOnZone) origOnZone(t);
        var idx = t < 0.2 ? 0 : t < 0.4 ? 1 : t < 0.6 ? 2 : t < 0.8 ? 3 : 4;
        setLogoZone(idx);
        updateSparks(idx);
      };
    </script>
  </body>
</html>
